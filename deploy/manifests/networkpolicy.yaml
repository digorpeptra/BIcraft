# Ingress on the HTTP and metrics ports only; egress to DNS only (no data leaves the pod). To let the
# server fetch an OIDC issuer's keys or reach Databricks, add an egress rule with the provider's CIDRs
# on 443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bicraft
  labels:
    app.kubernetes.io/name: bicraft
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bicraft
      app.kubernetes.io/instance: bicraft-main
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      # Restrict to the ingress controller (or the auth proxy) once known, e.g.:
      # from:
      #   - namespaceSelector:
      #       matchLabels:
      #         kubernetes.io/metadata.name: ingress-system
    # The metrics port (/metrics only, no model data): restrict to Prometheus once known.
    - ports:
        - port: metrics
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
