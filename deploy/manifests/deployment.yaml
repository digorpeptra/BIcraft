# `bicraft serve` for one workspace ("main"), without Helm (docs/kubernetes.md, "Plain manifests").
# What to adapt: the image, the workspace id (the mount path and the grant), the sizing block, the
# host names. `cargo xtask deploy smoke` starts the binary with exactly these arguments and
# variables (paths mapped to a scratch folder), and `cargo xtask deploy check` keeps them in line
# with the code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bicraft
  labels:
    app.kubernetes.io/name: bicraft
    app.kubernetes.io/instance: bicraft-main
    app.kubernetes.io/component: mcp-server
    bicraft.dev/workspace: main
spec:
  # One session per workspace: never two pods on one volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bicraft
      app.kubernetes.io/instance: bicraft-main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bicraft
        app.kubernetes.io/instance: bicraft-main
        app.kubernetes.io/component: mcp-server
        bicraft.dev/workspace: main
      annotations:
        # Annotation-based scrape configs (with the Prometheus Operator, use servicemonitor.yaml).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # No <SERVICE>_PORT variables: the Service named bicraft would inject BICRAFT_* names.
      enableServiceLinks: false
      # --shutdown-grace (30) + 5 s.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bicraft
          image: bicraft:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --root
            - /srv/bicraft
            - --listen
            - 0.0.0.0:7878
            - --shutdown-grace
            - "30"
            - --max-upload-bytes
            - 4G
            - --ready-memory-percent
            - "95"
            # Journals of unsaved edits, one subfolder per workspace, on a volume of their own
            # outside the workspace's files (docs/recovery.md).
            - --recovery-dir
            - /var/lib/bicraft/recovery
            # Prometheus metrics on their own port: /metrics only, no authentication, no model data.
            - --metrics-listen
            - $(POD_IP):9090
          env:
            # Declared first: --metrics-listen refers to it (the listener binds the pod IP only).
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TMPDIR
              value: /tmp
            # One JSON line per request (no model data: docs/kubernetes.md, "Observability").
            - name: BICRAFT_LOG_FORMAT
              value: json
            - name: BICRAFT_SPILL_DIR
              value: /tmp
            # Sizing (an admin setting): pod memory limit = BICRAFT_MEMORY_LIMIT + 64 MiB.
            - name: BICRAFT_MEMORY_LIMIT
              value: 1984M
            - name: BICRAFT_SCAN_THREADS
              value: "2"
            - name: BICRAFT_AGG_THREADS
              value: "1"
            - name: BICRAFT_AGGREGATIONS
              value: "1"
            # The Databricks connector stays off (no egress).
            - name: BICRAFT_SERVER_NETWORK
              value: "0"
            # Authentication: API tokens (hashes in the Secret bicraft-tokens) and one grant.
            - name: BICRAFT_API_TOKENS_FILE
              value: /etc/bicraft/tokens/tokens.json
            - name: BICRAFT_AUTH_GRANTS
              value: token:agent=main
            # Read-only access (docs/auth.md "Roles"), e.g. a dashboard token:
            # - name: BICRAFT_AUTH_READER_GRANTS
            #   value: token:viewer=main
            # Host names answered: the Service's names (add the ingress host, or set BICRAFT_PUBLIC_URL).
            - name: BICRAFT_ALLOWED_HOSTS
              value: bicraft,bicraft:7878,bicraft.bicraft.svc,bicraft.bicraft.svc:7878,bicraft.bicraft.svc.cluster.local,bicraft.bicraft.svc.cluster.local:7878
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "2"
              memory: 2048Mi
            limits:
              cpu: "2"
              memory: 2048Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: workspace
              mountPath: /srv/bicraft/main
            - name: tmp
              mountPath: /tmp
            - name: recovery
              mountPath: /var/lib/bicraft/recovery
            - name: tokens
              mountPath: /etc/bicraft/tokens
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: bicraft-main
        # Disk-backed (never the Memory medium): spill files must not count against the pod's memory.
        - name: tmp
          emptyDir:
            sizeLimit: 20Gi
        - name: recovery
          persistentVolumeClaim:
            claimName: bicraft-main-recovery
        - name: tokens
          secret:
            secretName: bicraft-tokens
            items:
              - key: tokens.json
                path: tokens.json
