# Optional, for the Prometheus Operator (needs its CRDs): the metrics port behind a headless Service of
# its own (the main Service and the ingress never route to it) and a ServiceMonitor scraping it. Without
# the operator, the pod's prometheus.io/* annotations serve annotation-based scrape configs.
apiVersion: v1
kind: Service
metadata:
  name: bicraft-metrics
  labels:
    app.kubernetes.io/name: bicraft
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: bicraft
    app.kubernetes.io/instance: bicraft-main
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bicraft
  labels:
    app.kubernetes.io/name: bicraft
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bicraft
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
