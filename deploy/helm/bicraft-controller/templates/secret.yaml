{{- if or (and .Values.auth.apiTokens.tokensJson (not .Values.auth.apiTokens.existingSecret)) (and .Values.auth.config.json (not .Values.auth.config.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bicraft-controller.authSecretName" . }}
  labels:
    {{- include "bicraft-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.auth.apiTokens.tokensJson (not .Values.auth.apiTokens.existingSecret) }}
  tokens.json: {{ .Values.auth.apiTokens.tokensJson | quote }}
  {{- end }}
  {{- if and .Values.auth.config.json (not .Values.auth.config.existingSecret) }}
  auth.json: {{ .Values.auth.config.json | quote }}
  {{- end }}
{{- end }}
