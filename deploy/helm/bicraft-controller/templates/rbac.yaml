apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bicraft-controller.fullname" . }}
  labels:
    {{- include "bicraft-controller.labels" . | nindent 4 }}
---
# Least privilege, in the release namespace only. No delete on the owned objects (the garbage
# collector removes them with their workspace), no access to pods, secrets or anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bicraft-controller.fullname" . }}
  labels:
    {{- include "bicraft-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [{{ .Values.crd.group | quote }}]
    resources: ["bicraftworkspaces"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [{{ .Values.crd.group | quote }}]
    resources: ["bicraftworkspaces/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bicraft-controller.fullname" . }}
  labels:
    {{- include "bicraft-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bicraft-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bicraft-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
