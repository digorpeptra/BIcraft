{{- if or .Values.auth.apiTokens.tokensJson .Values.auth.config.json }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bicraft.authSecretName" . }}
  labels:
    {{- include "bicraft.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.auth.apiTokens.tokensJson }}
  # SHA-256 hashes of the API tokens, never the tokens themselves (docs/auth.md).
  tokens.json: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.config.json }}
  auth.json: {{ . | quote }}
  {{- end }}
{{- end }}
