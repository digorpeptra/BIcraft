{{- if .Values.ingress.enabled }}
{{- $svc := include "bicraft.fullname" . -}}
{{- $port := int .Values.service.port -}}
{{- $id := .Values.workspace.id -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc }}
  labels:
    {{- include "bicraft.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          # The workspace (MCP endpoint and files). The probes are not exposed.
          - path: {{ printf "/w/%s/" $id }}
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ $port }}
          # OAuth protected-resource metadata (RFC 9728), served when an OIDC issuer is configured.
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ $port }}
    {{- end }}
{{- end }}
