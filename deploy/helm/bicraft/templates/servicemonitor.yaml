{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
# The metrics port behind a Service of its own (the main Service and the ingress never route to it),
# and the Prometheus Operator's ServiceMonitor for it (docs/kubernetes.md, "Observability").
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" (include "bicraft.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "bicraft.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    bicraft.dev/workspace: {{ .Values.workspace.id | quote }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "bicraft.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ int .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bicraft.fullname" . }}
  labels:
    {{- include "bicraft.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "bicraft.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
