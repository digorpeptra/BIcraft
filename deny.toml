# cargo-deny (https://embarkstudios.github.io/cargo-deny/): the licences, sources, advisories
# and duplicate crates of the whole dependency graph, dev and build dependencies included.
# `cargo xtask deny` runs it when cargo-deny is installed; the `deny` job of
# .github/workflows/ci.yml runs it on every push. A new dependency needs a licence below (or an
# exception with its reason), a row in THIRD_PARTY_NOTICES.md when its material is embedded, and
# crates.io as its source (AGENTS.md §1).

[graph]
# Every target BIcraft builds for, so a platform-only dependency is checked too.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# RustSec advisories: vulnerabilities fail; unmaintained crates fail only for direct
# dependencies, yanked versions warn.
unmaintained = "workspace"
yanked = "warn"
# None is ignored today. An ignored advisory must say why it does not reach BIcraft, and its
# line goes when the crate is upgraded (docs/gaps.md G38: zip 9, skrifa and harfrust removed the
# last ones).
ignore = []

[licenses]
# Permissive licences only. Each one listed is used by some crate of the tree today
# (`cargo deny list`); a licence that is not here fails until it is reviewed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots: Mozilla's root certificates (ATTRIBUTION.md)
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# Not permissive in the allowlist's sense, or not a software licence: allowed for these crates
# only, each for its reason.
exceptions = [
    # The fonts egui embeds (Ubuntu Light, Hack, Noto Emoji, emoji icons; ATTRIBUTION.md).
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
    # Our renderer embeds the Selawik fonts (OFL-1.1, crates/render/fonts/, ATTRIBUTION.md).
    { allow = ["OFL-1.1"], crate = "bicraft-render" },
]

[licenses.private]
# Workspace crates that are never published (xtask) carry no licence field.
ignore = true

[bans]
# Two major versions of one crate build twice; worth knowing, not worth failing on (they come
# with the GUI and platform stacks).
multiple-versions = "warn"
# The workspace's own path dependencies carry no version (`bicraft-opc.workspace = true`), which
# cargo-deny counts as wildcards for crates that could be published; the sources check below
# keeps everything else on crates.io, where every dependency names a version.
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# crates.io only: no git dependencies, no other registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
