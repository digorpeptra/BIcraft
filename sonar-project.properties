sonar.projectKey=digorpeptra_BIcraft
sonar.organization=digorpeptra

# Sources and tests both start at the root, as in the other Crafting Apps: test files are the
# tests/ directories, tests.rs and *_tests.rs.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/tests.rs,**/*_tests.rs

# Vendored files under their own licence (THIRD_PARTY_NOTICES.md): Microsoft's MIT JSON schemas,
# the MIT best-practice rules and the licence texts. They are kept unmodified, so they are not
# analysed as BIcraft's code.
sonar.exclusions=crates/pbir/schemas/**,crates/visuals/schemas/**,crates/bpa/rules/**,licenses/**
