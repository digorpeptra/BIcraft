# Dependabot (docs/ci.md): weekly update pull requests, grouped so a week's bumps arrive as one
# or two pull requests. A bump still has to pass the gate, `cargo deny` (deny.toml) included.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      # The egui stack moves together (and may raise the UI's rust-version): one pull request.
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
      # Other patch and minor bumps together; a major bump gets a pull request of its own.
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      # Actions are pinned by SHA with the tag in a comment; Dependabot updates both.
      actions:
        patterns: ["*"]
