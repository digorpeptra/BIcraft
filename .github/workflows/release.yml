# Release: on a `v*` tag, build the release archives with `cargo xtask dist` (docs/releasing.md),
# the same packaging as a local release, and attach them and their SHA-256 sums to a draft GitHub
# release for that tag.
#
# Archives: bicraft-<version>-windows-x64.zip (`bicraft.exe`, the desktop app, `bicraft-cli.exe`,
# the CLI and MCP server, and install.ps1) and bicraft-<version>-linux-x64.tar.gz (`bin/bicraft`,
# `bin/bicraft-cli`, linked against glibc, the desktop integration under `share/`, and
# install.sh), each with the README, the MCP reference, BIcraft's Power BI visuals, the licences
# and the notices. SHA256SUMS lists every archive.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - only: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu runner, so the binaries need a glibc that old distros have
          # (2.35). Nothing to apt-get: the window and graphics libraries are loaded at run time.
          - only: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-05
        with:
          toolchain: stable
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      # Every release bicraft-cli embeds the browser app (docs/webui.md): the wasm-bindgen CLI of
      # the version in Cargo.lock, which `cargo xtask dist` finds through BICRAFT_WEBUI_TOOLS.
      - name: wasm-bindgen CLI
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked --root "$RUNNER_TEMP/webui-tools"
          echo "BICRAFT_WEBUI_TOOLS=$RUNNER_TEMP/webui-tools" >> "$GITHUB_ENV"

      # Builds both programs, packages them and smoke-tests the archive from its extracted copy
      # (both --version lines against the workspace version, the desktop app's offscreen render,
      # the MCP handshake, the install script).
      - name: cargo xtask dist
        run: cargo xtask dist --only ${{ matrix.only }} --out "$RUNNER_TEMP/dist"

      - name: Check the version against the tag
        run: |
          ls "$RUNNER_TEMP/dist"
          if ! ls "$RUNNER_TEMP/dist" | grep -q "^bicraft-${TAG#v}-"; then
            echo "::error::no archive for version ${TAG#v} (bump the workspace version)"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.only }}
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.zip *.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          name: BIcraft ${{ env.TAG }}
          draft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
