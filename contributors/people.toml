# Contributor names, in the same format as the other Crafting Apps. No About window reads them
# yet (docs/method.md, decision 8); contributors.json holds the commit statistics per GitHub
# username, generated from the history (never hand-edited beyond a regeneration).
#
# Everyone who contributes is credited by GitHub username. Anything more is
# up to you: add YOUR OWN entry below, in your own commit. Never add someone else; a maintainer
# may add a person only when that person asked, recording where in consent_source.
#
# Copy this block, replacing your-github-username (every field is optional):
#
#   [people.your-github-username]
#   real_name = "Your Name"        # shown when the viewer picks "Real name"
#   display_name = "Nickname"      # shown when the viewer picks "Display name"
#   sync_github_name = true        # or: use the name on your public GitHub profile as display name
#
# To remove your names, delete your entry (or set fields empty). Git author names and emails are
# never recorded here.
