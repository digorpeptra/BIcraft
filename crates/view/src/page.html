<style>
:root {
  color-scheme: light dark;
  --bg: #f3f4f7; --surface: #ffffff; --surface2: #eef0f4; --text: #1b2230; --muted: #5d6879; --faint: #8b95a4;
  --border: #d7dce4; --accent: #2563c9; --accent-soft: rgba(37, 99, 201, .12);
  --err: #cf3434; --err-soft: rgba(207, 52, 52, .10); --warn: #c97800; --warn-soft: rgba(217, 130, 0, .13);
  --ok: #1d8a4c; --ok-soft: rgba(29, 138, 76, .12);
  --sheet: #ffffff; --sheet-border: #c6cdd8; --vis: #f6f8fb; --vis-border: #9ba8ba; --flash: rgba(255, 190, 0, .55);
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 6px 22px rgba(16, 24, 40, .08); --wall: #e8e8e8;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1217; --surface: #161b22; --surface2: #1d232c; --text: #e3e7ed; --muted: #9ca6b4; --faint: #6c7786;
    --border: #2b333e; --accent: #6fa3ff; --accent-soft: rgba(111, 163, 255, .16);
    --err: #ff6b6b; --err-soft: rgba(255, 107, 107, .13); --warn: #f0a535; --warn-soft: rgba(240, 165, 53, .14);
    --ok: #4cc47f; --ok-soft: rgba(76, 196, 127, .14);
    --sheet: #1a2028; --sheet-border: #384250; --vis: #222a35; --vis-border: #586577; --flash: rgba(255, 200, 40, .40);
    --shadow: 0 0 0 1px rgba(0, 0, 0, .3), 0 8px 26px rgba(0, 0, 0, .35); --wall: #2e3135;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
}
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: .95em; }
.muted { color: var(--muted); }

/* header */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 16px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 7px; font-weight: 650; letter-spacing: .01em; }
.brand svg { width: 18px; height: 18px; }
.brand small { font-weight: 450; color: var(--muted); }
.source { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 260px; }
.source .path { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; direction: rtl; text-align: left; }
.meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 11.5px;
  background: var(--surface2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
}
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.pill.err { color: var(--err); background: var(--err-soft); border-color: transparent; }
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.pill.acc { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.cmd { font-family: var(--mono); font-size: 11.5px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.cmd.flash { animation: cmdflash 1.6s ease-out both; }
@keyframes cmdflash { 0% { box-shadow: 0 0 0 4px var(--flash); } 100% { box-shadow: 0 0 0 0 transparent; } }
.conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.conn.live i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.conn.down i { background: var(--err); }
.conn.wait i { background: var(--warn); }
/* open in Power BI Desktop (header) */
.open { display: flex; align-items: center; gap: 6px; min-width: 0; }
.open:empty { display: none; }
.obtn {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text); white-space: nowrap;
}
.obtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.obtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.obtn:disabled { opacity: .55; cursor: not-allowed; }
.obtn svg { width: 13px; height: 13px; flex: none; }
.obtn .dot { color: var(--warn); }
.obtn.busy { cursor: progress; }
.omsg { font-size: 11.5px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.omsg.ok { color: var(--ok); } .omsg.err { color: var(--err); }

/* tabs */
nav.tabs { display: flex; gap: 2px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab {
  border: 0; background: none; padding: 8px 12px 7px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.count { font-size: 11px; padding: 0 6px; border-radius: 999px; color: #fff; background: var(--faint); font-weight: 600; }

      }, h('span', { class: 'tb t-m' }, m.valid === false ? '!' : 'Σ'), h('span', { class: 'rn' }, mn),
      str(m.format_string) && h('span', { class: 'fmt' }, str(m.format_string)));
    })),
    (cols.length > ROWS_COLLAPSED || meas.length > ROWS_COLLAPSED) && h('button', {
      class: 'more', onclick: () => { if (expanded) UI.expanded.delete(name); else UI.expanded.add(name); scheduleRender(); },
    }, expanded ? 'Show less' : 'Show all (' + plural(cols.length, 'column') + ', ' + plural(meas.length, 'measure') + ')'),
    t.truncated === true && h('div', { class: 'note', style: { padding: '2px 9px' } }, 'truncated'));
  els.tables.set(name, { card, head, cols: colEls });
  return card;
}

function drawRels() {
  const M = modelEls;
  if (!M || !M.canvas || !M.canvas.isConnected) return;
  const svgEl = M.svg;
  const cr = M.canvas.getBoundingClientRect();
  svgEl.setAttribute('width', String(M.canvas.scrollWidth));
  svgEl.setAttribute('height', String(M.canvas.scrollHeight));
  const parts = [];
  M.rels.forEach((r, i) => {
    const A = M.tables.get(str(r.from_table)), B = M.tables.get(str(r.to_table));
    if (!A || !B) return;
    const ra = (A.cols.get(str(r.from_column)) || A.head).getBoundingClientRect();
    const rb = (B.cols.get(str(r.to_column)) || B.head).getBoundingClientRect();
    const ca = A.card.getBoundingClientRect(), cb = B.card.getBoundingClientRect();
    const ya = ra.top + ra.height / 2 - cr.top, yb = rb.top + rb.height / 2 - cr.top;
    let xa, xb, da, db;
    if (cb.left >= ca.right) { xa = ca.right - cr.left; xb = cb.left - cr.left; da = 1; db = -1; }
    else if (ca.left >= cb.right) { xa = ca.left - cr.left; xb = cb.right - cr.left; da = -1; db = 1; }
    else { xa = ca.right - cr.left; xb = cb.right - cr.left; da = 1; db = 1; }
    const bend = Math.max(36, Math.abs(xb - xa) / 2);
    const p0 = [xa, ya], p1 = [xa + da * bend, ya], p2 = [xb + db * bend, yb], p3 = [xb, yb];
    const d = 'M' + p0 + ' C' + p1 + ' ' + p2 + ' ' + p3;
    const fc = str(r.from_cardinality).toLowerCase(), tc = str(r.to_cardinality).toLowerCase();
    const card = c => c === 'one' ? '1' : c === 'many' ? '*' : '';
    const cf = str(r.cross_filter).toLowerCase();
    // Midpoint and tangent of the cubic at t = 0.5.
    const mid = [0, 1].map(k => (p0[k] + 3 * p1[k] + 3 * p2[k] + p3[k]) / 8);
    const tan = [0, 1].map(k => (p3[k] + p2[k] - p1[k] - p0[k]));
    const len = Math.hypot(tan[0], tan[1]) || 1;
    const u = [tan[0] / len, tan[1] / len], n = [-u[1], u[0]];
    const arrow = (dir, off) => {
      const c = [mid[0] + u[0] * off, mid[1] + u[1] * off];
      const t = [c[0] + dir * u[0] * 5, c[1] + dir * u[1] * 5];
      const b1 = [c[0] - dir * u[0] * 4 + n[0] * 4.5, c[1] - dir * u[1] * 4 + n[1] * 4.5];
      const b2 = [c[0] - dir * u[0] * 4 - n[0] * 4.5, c[1] - dir * u[1] * 4 - n[1] * 4.5];
      return svg('polygon', { points: [t, b1, b2].map(p => p.join(',')).join(' ') });
    };
    // Filters flow from the "one" side to the "many" side (towards `from` by default).
    const towardsFrom = !(fc === 'one' && tc === 'many');
    const arrows = cf === 'both' ? [arrow(-1, -7), arrow(1, 7)] : [arrow(towardsFrom ? -1 : 1, 0)];
    const label = str(r.from_table) + '[' + str(r.from_column) + '] ' + (card(fc) || '?') + ' → ' + (card(tc) || '?') + ' ' +
      str(r.to_table) + '[' + str(r.to_column) + ']\ncross filter: ' + (cf || '?') + (r.active === false ? '\ninactive' : '');
    const selected = UI.sel && UI.sel.kind === 'rel' && UI.sel.index === i;
    parts.push(svg('g', { class: cls('rel', r.active === false && 'inactive', selected && 'sel'), onclick: () => select({ kind: 'rel', index: i }) },
      svg('title', null, label),
      svg('path', { class: 'ln', d }), svg('path', { class: 'hit', d }), arrows,
      card(fc) && svg('text', { x: xa + da * 8 - (da < 0 ? 7 : 0), y: ya - 5 }, card(fc)),
      card(tc) && svg('text', { x: xb + db * 8 - (db < 0 ? 7 : 0), y: yb - 5 }, card(tc))));
  });
  svgEl.replaceChildren(...parts);
}

function diagnosticsFor(table, name) {
  const objs = arr(obj(obj(S.snap && S.snap.validation).model).objects).filter(isObj);
  return objs.filter(o => str(o.table) === table && str(o.name) === name).flatMap(o => arr(o.diagnostics).length ? arr(o.diagnostics) : ['invalid']);
}

function modelPanel(model, tables) {
  const sel = UI.sel;
  const table = sel && tables.find(t => str(t.name) === sel.table);
  const close = h('button', { class: 'x', title: 'Close (Esc)', onclick: () => select(null) }, '×');
  const toTable = n => h('span', { class: 'link', onclick: () => select({ kind: 'table', table: n }) }, n);
  if (sel && sel.kind === 'measure' && table) {
    const m = arr(table.measures).filter(isObj).find(x => str(x.name) === sel.name);
    if (m) {
      const diags = diagnosticsFor(sel.table, sel.name);
      return h('aside', { class: 'panel', 'data-keep': 'panel-measure' },
        h('div', { class: 'ph' }, h('span', { class: 'tb t-m', style: { marginTop: '3px' } }, m.valid === false ? '!' : 'Σ'),
          h('div', { class: 'pt' }, h('div', { class: 'ptitle' }, str(m.name)), h('div', { class: 'psub' }, 'Measure in ', toTable(sel.table))), close),
        m.valid === false ? h('span', { class: 'pill err' }, 'invalid DAX') : h('span', { class: 'pill ok' }, m.valid === true ? 'valid' : 'not validated'),
        diags.length > 0 && section('Diagnostics', issueList(diags)),
        section('Expression', h('pre', { class: 'dax' }, clip(str(m.expression), 200000) || '(empty)')),
        section('Properties', kv([['format', str(m.format_string) ? h('span', { class: 'mono' }, str(m.format_string)) : '–'],
          ['folder', str(m.display_folder) || '–'], ['hidden', yesNo(m.hidden)]])),
        h('details', { class: 'raw' }, h('summary', null, 'Raw JSON'), h('pre', null, safeJson(m, 60000, 2))));
    }
  }
  if (sel && sel.kind === 'column' && table) {
    const c = arr(table.columns).filter(isObj).find(x => str(x.name) === sel.name);
    if (c) {
      const diags = diagnosticsFor(sel.table, sel.name);
      const expr = str(c.expression);
      return h('aside', { class: 'panel', 'data-keep': 'panel-column' },
        h('div', { class: 'ph' }, h('span', { class: 'tb', style: { marginTop: '3px' } }, typeBadge(c.data_type)[0]),
          h('div', { class: 'pt' }, h('div', { class: 'ptitle' }, str(c.name)), h('div', { class: 'psub' }, (c.calculated === true ? 'Calculated column in ' : 'Column in '), toTable(sel.table))), close),
        diags.length > 0 && section('Diagnostics', issueList(diags)),
        section('Properties', kv([['data type', str(c.data_type) || '–'], ['calculated', yesNo(c.calculated)], ['hidden', yesNo(c.hidden)]])),
        expr && section('Expression', h('pre', { class: 'dax' }, clip(expr, 200000))),
        relsOf(sel.table, sel.name).length > 0 && section('Relationships', relsOf(sel.table, sel.name)),
        h('details', { class: 'raw' }, h('summary', null, 'Raw JSON'), h('pre', null, safeJson(c, 60000, 2))));
    }
  }
  if (sel && sel.kind === 'table' && table) {
    const cols = arr(table.columns).filter(isObj), meas = arr(table.measures).filter(isObj);
    const rows = [...cols.map(c => ({ c })), ...meas.map(m => ({ m }))];
    return h('aside', { class: 'panel', 'data-keep': 'panel-table' },
      h('div', { class: 'ph' }, icon('model'), h('div', { class: 'pt' }, h('div', { class: 'ptitle' }, str(table.name)),
        h('div', { class: 'psub' }, 'Table' + (table.hidden === true ? ' · hidden' : ''))), close),
      section('Contents', kv([['columns', String(cols.length)], ['measures', String(meas.length)]])),
      relsOf(sel.table, null).length > 0 && section('Relationships', relsOf(sel.table, null)),
      section('Columns and measures', rows.length ? vlist(rows, row => row.c
        ? h('div', { class: cls('vrow', row.c.hidden === true && 'hid'), onclick: () => select({ kind: 'column', table: sel.table, name: str(row.c.name) }) },
          h('span', { class: 'tb' }, typeBadge(row.c.data_type)[0]), h('span', { class: 'grow' }, str(row.c.name)), row.c.calculated === true && h('span', { class: 'calc' }, 'ƒx'))
        : h('div', { class: cls('vrow', row.m.hidden === true && 'hid'), onclick: () => select({ kind: 'measure', table: sel.table, name: str(row.m.name) }) },
          h('span', { class: 'tb t-m' }, row.m.valid === false ? '!' : 'Σ'), h('span', { class: 'grow' }, str(row.m.name)), row.m.valid === false && h('span', { class: 'pill err' }, 'invalid')),
      420, 'table-rows') : h('div', { class: 'muted' }, 'Empty table.')),
      h('details', { class: 'raw' }, h('summary', null, 'Raw JSON (first 60 kB)'), h('pre', null, safeJson(table, 60000, 2))));
  }
  if (sel && sel.kind === 'rel') {
    const r = arr(model.relationships).filter(isObj)[sel.index];
    if (r) {
      return h('aside', { class: 'panel', 'data-keep': 'panel-rel' },
        h('div', { class: 'ph' }, h('div', { class: 'pt' }, h('div', { class: 'ptitle' }, 'Relationship'),
          h('div', { class: 'psub' }, r.active === false ? 'inactive' : 'active')), close),
        section('From', kv([['table', toTable(str(r.from_table))], ['column', str(r.from_column)], ['cardinality', str(r.from_cardinality) || '–']])),
        section('To', kv([['table', toTable(str(r.to_table))], ['column', str(r.to_column)], ['cardinality', str(r.to_cardinality) || '–']])),
        section('Behaviour', kv([['cross filter', str(r.cross_filter) || '–'], ['active', yesNo(r.active !== false)]])),
        h('details', { class: 'raw' }, h('summary', null, 'Raw JSON'), h('pre', null, safeJson(r, 60000, 2))));
    }
  }
  // Summary
  const bad = [];
  for (const t of tables) for (const m of arr(t.measures).filter(isObj)) if (m.valid === false) bad.push({ t: str(t.name), m: str(m.name) });
  return h('aside', { class: 'panel', 'data-keep': 'panel-model' },
    h('div', { class: 'ph' }, icon('model'), h('div', { class: 'pt' }, h('div', { class: 'ptitle' }, str(model.name) || 'Model'),
      h('div', { class: 'psub' }, 'Semantic model · click a table, column or measure'))),
    section('Model', kv([['culture', str(model.culture) || '–'], ['tables', String(tables.length)],
      ['relationships', String(arr(model.relationships).length)]])),
    bad.length > 0 && section('Invalid measures', vlist(bad, b => h('div', { class: 'vrow', onclick: () => select({ kind: 'measure', table: b.t, name: b.m }) },
      h('span', { class: 'tb t-m' }, '!'), h('span', { class: 'grow' }, b.m), h('span', { class: 'where' }, b.t)), 300, 'bad-measures')),
    section('Tables', tables.length ? vlist(tables, t => h('div', { class: cls('vrow', t.hidden === true && 'hid'), onclick: () => select({ kind: 'table', table: str(t.name) }) },
      icon('model'), h('span', { class: 'grow' }, str(t.name)), h('span', { class: 'where' }, arr(t.columns).length + ' · ' + arr(t.measures).length)), 420, 'model-tables')
      : h('div', { class: 'muted' }, 'No tables yet.')));
}

function relsOf(table, column) {
  const rels = arr(obj(S.snap && S.snap.model).relationships).filter(isObj);
  const out = [];
  rels.forEach((r, i) => {
    const from = str(r.from_table) === table && (column == null || str(r.from_column) === column);
    const to = str(r.to_table) === table && (column == null || str(r.to_column) === column);
    if (!from && !to || out.length >= 200) return;
    out.push(h('div', { class: 'vrow', onclick: () => select({ kind: 'rel', index: i }) },
      h('span', { class: 'grow mono' }, str(r.from_table) + '[' + str(r.from_column) + '] → ' + str(r.to_table) + '[' + str(r.to_column) + ']'),
      r.active === false && h('span', { class: 'pill' }, 'inactive')));
  });
  return out;
}

// ---------------------------------------------------------------------------------------------
// Validation view
function jumpVisual(pk, name) {
  const report = obj(S.snap && S.snap.report);
  UI.tab = 'report'; store.set('tab', 'report');
  UI.page = pk; UI.follow = str(report.active_page) === pk;
  UI.sel = { kind: 'visual', page: pk, name };
  scheduleRender();
}
function jumpModel(table, kind, name) {
  UI.tab = 'model'; store.set('tab', 'model');
  const k = str(kind).toLowerCase();
  UI.sel = !name ? { kind: 'table', table } : k.includes('column') ? { kind: 'column', table, name } : { kind: 'measure', table, name };
  scheduleRender();
}
function issueRow(row) {
  return h('div', { class: 'vrow', title: (row.where ? row.where + '\n' : '') + row.msg, onclick: row.go || null, style: { cursor: row.go ? 'pointer' : 'default' } },
    h('span', { class: cls('sev', row.sev) }, sevWord(row.sev)), row.where && h('span', { class: 'where' }, row.where), h('span', { class: 'grow' }, row.msg));
}
function statusPill(valid, text) {
  return valid === true ? h('span', { class: 'pill ok' }, '✓ valid') : valid === false ? h('span', { class: 'pill err' }, text || '✕ invalid') : h('span', { class: 'pill' }, 'not checked');
}
function renderValidation() {
  const snap = S.snap;
  if (!snap) return empty('Waiting for the first snapshot…', '');
  const val = obj(snap.validation);
  const vm = val.model, vr = val.report;

  const modelRows = [];
  for (const o of arr(obj(vm).objects).filter(isObj).slice(0, 20000)) {
    const where = [str(o.table), str(o.name)].filter(Boolean).join(' · ') + (str(o.kind) ? ' (' + str(o.kind) + ')' : '');
    const go = str(o.table) ? () => jumpModel(str(o.table), o.kind, str(o.name)) : null;
    const diags = arr(o.diagnostics);
    if (!diags.length) modelRows.push({ sev: 'err', where, msg: 'invalid', go });
    for (const d of diags.slice(0, 200)) modelRows.push({ sev: sevOf(d), where, msg: msgOf(d), go });
  }
  const reportRows = arr(obj(vr).issues).slice(0, 20000).map(i => ({ sev: sevOf(i), where: whereOf(i), msg: msgOf(i) }));
  const visualRows = [];
  const pages = arr(obj(snap.report).pages).filter(isObj);
  pages.forEach((p, pi) => {
    const pk = pageKey(p, pi), pl = str(p.display_name) || pk;
    for (const v of arr(p.visuals).filter(isObj)) {
      if (visualRows.length >= 20000) return;
      for (const i of arr(v.issues).slice(0, 50)) {
        visualRows.push({ sev: sevOf(i), where: pl + ' › ' + (str(v.title) || typeLabel(v)), msg: msgOf(i), go: () => jumpVisual(pk, str(v.name)) });
      }
    }
  });
  const byWorst = (a, b) => (a.sev === 'err' ? 0 : 1) - (b.sev === 'err' ? 0 : 1);
  visualRows.sort(byWorst);

  const mo = obj(vm), ro = obj(vr);
  const modelCard = h('div', { class: 'vcard' },
    h('h2', null, 'Model', isObj(vm) ? statusPill(mo.valid, plural(num(mo.invalid_count, modelRows.length), 'invalid object')) : h('span', { class: 'pill' }, snap.model == null ? 'no model' : 'not available')),
    isObj(vm) && (modelRows.length ? vlist(modelRows, issueRow, 520, 'val-model') : h('p', null, mo.valid === false ? 'Invalid, without details.' : 'All measures and calculated objects bind.')),
    mo.truncated === true && h('p', { class: 'note' }, 'List truncated by bicraft.'));
  const reportCard = h('div', { class: 'vcard' },
    h('h2', null, 'Report', isObj(vr) ? statusPill(ro.valid, '✕ invalid') : h('span', { class: 'pill' }, snap.report == null ? 'no report' : 'not available'),
      isObj(vr) && num(ro.error_count) > 0 && h('span', { class: 'pill err' }, plural(num(ro.error_count), 'error')),
      isObj(vr) && num(ro.warning_count) > 0 && h('span', { class: 'pill warn' }, plural(num(ro.warning_count), 'warning'))),
    isObj(vr) && (reportRows.length ? vlist(reportRows, issueRow, 520, 'val-report') : h('p', null, 'No report issues.')),
    ro.truncated === true && h('p', { class: 'note' }, 'List truncated by bicraft.'));
  const visualCard = h('div', { class: 'vcard' },
    h('h2', null, 'Visual issues', h('span', { class: cls('pill', visualRows.length ? (visualRows.some(r => r.sev === 'err') ? 'err' : 'warn') : 'ok') }, visualRows.length ? String(visualRows.length) : 'none')),
    visualRows.length ? vlist(visualRows, issueRow, 520, 'val-visuals') : h('p', null, pages.length ? 'No visual reports an issue.' : 'No pages.'),
    visualRows.length > 0 && h('p', null, 'Click an issue to show the visual.'));
  return h('div', { class: 'vgrid', 'data-keep': 'vgrid' }, modelCard, reportCard, visualCard);
}

// ---------------------------------------------------------------------------------------------
// Boot
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sel) select(null);
});
let layoutQueued = false;
const relayout = () => { if (layoutQueued) return; layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layout(); }); };
if (typeof ResizeObserver === 'function') new ResizeObserver(relayout).observe($('#view'));
window.addEventListener('resize', relayout);
render();
connect();
})();
</script>
